<!DOCTYPE html>
<!-- players.html is filled in by the backend (backend/app.py): each {{...}} is replaced with real content -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Players | Pindiz Records</title>
    <!-- EXTERNAL CSS: one stylesheet for every page -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- HEADER: the same on every page -->
    <header>
        <a class="brand" href="index.html"><img src="images/logo.png" alt="Pindiz team logo">Pindiz Records</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="players.html">Players</a>
            <a href="entry.html">Entry Form</a>
            <a href="findings.html">Findings</a>
        </nav>
    </header>

    <main>
        {{MESSAGE}}

        <!-- 1. COMPARE: the only part that uses Gemini -->
        <h2>Compare two players</h2>
        <div class="box">
            <form action="compare" method="get">
                <div class="compare-form">
                    <div>
                        <label for="player1">Player 1</label>
                        <select id="player1" name="player1">
                            {{OPTIONS_1}}
                        </select>
                    </div>
                    <div>
                        <label for="player2">Player 2</label>
                        <select id="player2" name="player2">
                            {{OPTIONS_2}}
                        </select>
                    </div>
                    <div>
                        <label for="stat">Chart shows</label>
                        <select id="stat" name="stat">
                            <option value="runs">Runs</option>
                            <option value="wickets">Wickets</option>
                        </select>
                    </div>
                </div>
                <p class="center"><button type="submit">Compare</button></p>
            </form>
        </div>

        <!-- 2. SQUAD: one card per player. Click a card to open the profile -->
        <h2>Squad</h2>
        <div class="filters">{{FILTERS}}</div>
        <div class="cards">
            {{CARDS}}
        </div>
        <p class="small center">{{COUNT}} players. Form compares the last 3 matches with the matches before them.</p>
    </main>

    <!-- FOOTER: the same on every page -->
    <footer>
        <p>Data source: ESPNcricinfo Statsguru</p>
        <a class="github" href="https://github.com/haiderimran019/pindiz-records"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg>GitHub</a>
    </footer>
</body>
</html>
